model:
  name: "distilbert-base-uncased"
  type: "transformer"
  num_labels: 3
  max_length: 128

training:
  epochs: 3
  batch_size: 16
  learning_rate: 2e-5
  warmup_steps: 100
  weight_decay: 0.01
  early_stopping_patience: 2
  test_size: 0.2
  val_size: 0.1
  random_state: 42

scheduler:
  type: "linear_with_warmup"

paths:
  processed_data: "data/processed/combined_dataset.csv"
  model_output: "models/saved/dl_model/"
  tokenizer_output: "models/saved/dl_tokenizer/"
  logs: "logs/dl_training.log"

labels:
  negative: 0
  neutral: 1
  positive: 2
