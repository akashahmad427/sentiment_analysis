model:
  name: "logistic_regression"
  type: "classical_ml"

vectorizer:
  type: "tfidf"
  max_features: 10000
  ngram_range: [1, 2]
  sublinear_tf: true

hyperparameters:
  C: [0.01, 0.1, 1, 10]
  solver: ["lbfgs", "saga"]
  max_iter: [200, 500]

paths:
  raw_data: "data/raw/"
  processed_data: "data/processed/combined_dataset.csv"
  model_output: "models/saved/ml_model.pkl"
  vectorizer_output: "models/saved/tfidf_vectorizer.pkl"
  logs: "logs/ml_training.log"

training:
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  cv_folds: 5

labels:
  positive: 2
  neutral: 1
  negative: 0
